[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["prompter"]

[project]
name = "prompter"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "sh>=2.4.0",
]

[project.scripts]
prompter = "prompter.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"prompter/console.py" = ["RUF001", "RUF002", "RUF003"]  # pure's ❯ is intentional
"tests/test_console.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true
explicit_package_bases = true
packages = ["prompter"]
